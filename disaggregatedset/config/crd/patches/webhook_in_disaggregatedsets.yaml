# Enables the conversion webhook on the DisaggregatedSet CRD.
# The caBundle field is left empty; it is injected at runtime by the
# operator's cert-controller (see pkg/cert/cert.go, CRDConversion entry).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: disaggregatedsets.disaggregatedset.x-k8s.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: disaggregatedset-system
          name: disaggregatedset-webhook-service
          path: /convert
      conversionReviewVersions:
        - v1
