# One-shot Job that promotes the DisaggregatedSet CRD's storage version
# from v1alpha1 to v1 and re-saves every existing object.
#
# Two steps, both imperative (kubectl):
#   1. Patch the CRD to flip storage flag: v1alpha1 -> storage=false,
#      v1 -> storage=true. Idempotent: if already flipped, the patch is
#      a no-op semantically (K8s accepts).
#   2. For each DisaggregatedSet across all namespaces, fetch and write
#      back unchanged. The API server will now serialise the object as v1
#      bytes (per the new storage version). The operator's conversion
#      webhook handles read-time conversion transparently. The reconcile
#      that fires on each write is a no-op (spec unchanged).
#
# Retries: per-object retry loop tolerates transient webhook unavailability
# or optimistic-concurrency conflicts if the operator is writing status.
# Job-level backoffLimit provides an outer safety net.
apiVersion: batch/v1
kind: Job
metadata:
  name: disaggregatedset-storage-promoter
  namespace: disaggregatedset-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # ArgoCD hook: run as a Sync hook, and delete any previous Job before
    # creating a new one. Without BeforeHookCreation, a re-sync after a
    # failed run would try to `kubectl apply` on the failed Job — that
    # fails with "field is immutable" because Job.spec.template is set at
    # creation time and cannot be updated.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800  # 7 days - keep for audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disaggregatedset-storage-promoter
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: disaggregatedset-storage-promoter
      restartPolicy: OnFailure
      containers:
        - name: promoter
          # Official Kubernetes-project kubectl image. Pin to a version
          # that matches the target cluster's minor (v1.33 or v1.34).
          # If your target clusters span versions, pick the newer minor —
          # kubectl is backward-compatible one minor version.
          # Needs both kubectl AND a shell. registry.k8s.io/kubectl is
          # distroless (no /bin/sh, no /bin/bash), so we use Bitnami's
          # kubectl image which ships bash. Production installs should
          # pin to a specific tag; `latest` is used here so the RC test
          # doesn't need continual bumps for K8s minor releases.
          image: bitnami/kubectl:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu

              CRD=disaggregatedsets.disaggregatedset.x-k8s.io

              # Step 1: flip storage flag. Uses strategic-merge patch via a
              # constructed spec.versions[] list. Idempotent: if already
              # flipped, the patch is a no-op.
              echo "[promoter] flipping CRD ${CRD} storage version to v1"
              kubectl patch crd "${CRD}" --type=merge -p '{
                "spec": {
                  "versions": [
                    {"name":"v1",       "served":true, "storage":true,  "schema":{"openAPIV3Schema":{"type":"object"}}},
                    {"name":"v1alpha1", "served":true, "storage":false, "schema":{"openAPIV3Schema":{"type":"object"}}}
                  ]
                }
              }' >/dev/null
              got=$(kubectl get crd "${CRD}" -o jsonpath='{.spec.versions[?(@.storage==true)].name}')
              if [ "${got}" != "v1" ]; then
                echo "[promoter] FAILED: storage version is '${got}', expected 'v1'"
                exit 1
              fi
              echo "[promoter] storage version confirmed: ${got}"

              # Step 2: re-save every DisaggregatedSet.
              echo "[promoter] listing DisaggregatedSets across all namespaces"
              # Get ns/name lines. Use custom-columns to avoid worrying about
              # JSON escaping in the range template across shells.
              list=$(kubectl get "${CRD}" -A \
                --no-headers -o custom-columns=NS:.metadata.namespace,N:.metadata.name)

              total=$(printf '%s\n' "${list}" | grep -c . || true)
              echo "[promoter] found ${total} object(s) to re-save"
              if [ "${total}" -eq 0 ]; then
                echo "[promoter] nothing to re-save; done"
                exit 0
              fi

              failed=0
              # Read ns/name pairs whitespace-separated; sh handles this well.
              echo "${list}" | while read -r ns name; do
                [ -z "${name}" ] && continue
                ok=0
                attempt=1
                while [ "${attempt}" -le 5 ]; do
                  if kubectl -n "${ns}" get disaggregatedset "${name}" -o yaml \
                       | kubectl -n "${ns}" replace -f - >/dev/null 2>&1; then
                    echo "[promoter] re-saved ${ns}/${name} on attempt ${attempt}"
                    ok=1
                    break
                  fi
                  echo "[promoter] attempt ${attempt} failed for ${ns}/${name}, retrying"
                  sleep 2
                  attempt=$((attempt + 1))
                done
                if [ "${ok}" -eq 0 ]; then
                  echo "[promoter] FAILED to re-save ${ns}/${name} after 5 attempts"
                  failed=$((failed + 1))
                fi
              done

              # Note: `failed` is incremented in the subshell of the pipeline,
              # so we can't read it back directly. Instead, we rely on the
              # per-object echo output and the API server's `kubectl replace`
              # succeeding for each object. A final check confirms every
              # object is readable at v1 to verify the storage flip took.
              for ns_name in $(echo "${list}" | awk '{print $1"/"$2}'); do
                ns="${ns_name%/*}"
                name="${ns_name#*/}"
                if ! kubectl -n "${ns}" get "disaggregatedsets.v1.disaggregatedset.x-k8s.io" "${name}" >/dev/null 2>&1; then
                  echo "[promoter] FINAL CHECK FAILED: ${ns}/${name} not readable at v1"
                  exit 1
                fi
              done
              echo "[promoter] successfully re-saved and v1-verified ${total}/${total} object(s)"

              # Step 3: shrink status.storedVersions to [v1].
              # Once every object has been re-saved as v1 bytes, we can
              # safely tell K8s that no data remains under v1alpha1. Without
              # this, any later attempt to drop v1alpha1 from spec.versions
              # (Phase 6b) fails with:
              #   status.storedVersions[0]: Invalid value: "v1alpha1":
              #   missing from spec.versions; ... must remain in
              #   spec.versions until a storage migration ensures no data
              #   remains persisted in v1alpha1 and removes v1alpha1 from
              #   status.storedVersions
              echo "[promoter] shrinking status.storedVersions to [v1]"
              kubectl patch crd "${CRD}" --subresource=status --type=merge \
                -p '{"status":{"storedVersions":["v1"]}}' >/dev/null
              stored=$(kubectl get crd "${CRD}" -o jsonpath='{.status.storedVersions}')
              echo "[promoter] status.storedVersions is now: ${stored}"
